name: fix-names
on: push
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in [0-9]*-*; do [ -f "$f" ] && git mv "$f" "${f#*-}"; done
          git config user.name "law-simplified-eg"
          git config user.email "vfrh890hh@gmail.com"
          git diff --cached --quiet || (git commit -m "Fix file names" && git push)
